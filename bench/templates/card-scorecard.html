<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Single light look on purpose: this is a fixed 1080x1350 image for the LinkedIn feed. */
:root { --bg: #f5f6f8; --paper: #fff; --fg: #141821; --muted: #5a6273; --line: #e1e4ea; --accent: #3b5bdb;
  --pass: #0f9d58; --pass-bg: #e3f5ea; --fail: #d93f3f; --fail-bg: #fbe7e7; --bar2: #9aa7c7;
  --d: "Bricolage Grotesque", "Avenir Next", sans-serif; --b: "Inter", -apple-system, sans-serif; --m: "JetBrains Mono", Menlo, monospace }
* { box-sizing: border-box; margin: 0 }
html, body { width: 1080px; height: 1350px; background: var(--bg); color: var(--fg); font-family: var(--b); overflow: hidden }
.card { width: 1080px; height: 1350px; padding: 72px 72px 60px; display: flex; flex-direction: column; gap: 40px }
.eyebrow { font: 700 20px var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--accent) }
.top { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: end }
h1 { font: 800 66px/1.0 var(--d); letter-spacing: -0.03em; margin-top: 18px }
.score { font-family: var(--d); line-height: .8; text-align: right }
.score b { font-size: 200px; font-weight: 800; letter-spacing: -0.05em }
.score span { font-size: 64px; color: var(--muted); font-weight: 500 }
.grid { display: grid; gap: 14px }
.tier { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 16px }
.tier b { font: 700 26px var(--d) } .tier small { font: 500 20px var(--m); color: var(--muted); margin-left: 10px }
.cells { display: flex; gap: 10px; flex-wrap: wrap }
.c { width: 74px; height: 74px; border-radius: 14px; display: grid; place-items: center; font: 700 34px var(--m) }
.c.p { background: var(--pass-bg); color: var(--pass) } .c.f { background: var(--fail-bg); color: var(--fail) }
.bars { display: grid; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 28px 30px }
.bars h2 { font: 700 24px var(--d); margin-bottom: 4px }
.row { display: grid; grid-template-columns: 290px 1fr 60px; gap: 18px; align-items: center }
.row .n { font: 600 21px var(--b) } .row .n span { display: block; font: 500 16px var(--m); color: var(--muted) }
.track { height: 30px; background: var(--bg); border-radius: 8px; overflow: hidden }
.fill { height: 100%; background: var(--bar2); border-radius: 8px }
.row.star .fill { background: var(--accent) }
.row .v { font: 800 32px var(--d); text-align: right }
.notes { display: grid; gap: 14px; font: 500 22px/1.4 var(--b) }
.notes div { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: baseline }
.notes i { font: 700 24px var(--m); font-style: normal } .notes .x { color: var(--fail) } .notes .q { color: var(--accent) }
.notes q { font-family: var(--m); font-size: 20px }
.foot { margin-top: auto; display: flex; justify-content: space-between; font: 500 19px var(--m); color: var(--muted); border-top: 2px solid var(--line); padding-top: 22px }
</style></head>
<body><div class="card" id="card"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent), s = D.runs[D.star];
const tiers = ["Easy", "Medium", "Hard", "Expert"];
document.getElementById("card").innerHTML = `
 <div class="top"><div><div class="eyebrow">${D.card.eyebrow}</div><h1>${D.card.headline}</h1></div>
   <div class="score"><b>${s.score}</b><span>/30</span></div></div>
 <div class="grid">${tiers.map(t => { const rows = s.rows.filter(r => r.tier === t);
   return `<div class="tier"><div><b>${t}</b><small>${rows.filter(r => r.pass).length}/${rows.length}</small></div>
   <div class="cells">${rows.map(r => `<div class="c ${r.pass ? "p" : "f"}">${r.pass ? "✓" : "✗"}</div>`).join("")}</div></div>`; }).join("")}</div>
 <div class="bars"><h2>${D.card.barsTitle}</h2>${D.order.map(k => { const r = D.runs[k];
   return `<div class="row ${k === D.star ? "star" : ""}"><div class="n">${r.name}<span>${r.sub}</span></div>
   <div class="track"><div class="fill" style="width:${r.score / 30 * 100}%"></div></div><div class="v">${r.score}</div></div>`; }).join("")}</div>
 <div class="notes">${D.card.notes.map(n => `<div><i class="${n[0] === "✗" ? "x" : "q"}">${n[0]}</i><span>${n[1]}</span></div>`).join("")}</div>
 <div class="foot"><span>${D.card.footL}</span><span>${D.card.footR}</span></div>`;
</script></body></html>
