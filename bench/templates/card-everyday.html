<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Single light look on purpose: carousel slide 2, a fixed 1080x1350 image. Same tokens as slide 1. */
:root { --bg: #f5f6f8; --paper: #fff; --fg: #141821; --muted: #5a6273; --line: #e1e4ea; --accent: #3b5bdb;
  --pass: #0f9d58; --pass-bg: #e3f5ea;
  --d: "Bricolage Grotesque", "Avenir Next", sans-serif; --b: "Inter", -apple-system, sans-serif; --m: "JetBrains Mono", Menlo, monospace }
* { box-sizing: border-box; margin: 0 }
html, body { width: 1080px; height: 1350px; background: var(--bg); color: var(--fg); font-family: var(--b); overflow: hidden }
.card { width: 1080px; height: 1350px; padding: 64px 64px 52px; display: flex; flex-direction: column; gap: 38px }
.eyebrow { font: 700 19px var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--accent) }
.top { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: end }
h1 { font: 800 60px/1.0 var(--d); letter-spacing: -0.03em; margin-top: 16px }
.score { font-family: var(--d); line-height: .8; text-align: right; white-space: nowrap }
.score b { font-size: 150px; font-weight: 800; letter-spacing: -0.05em }
.score span { font-size: 54px; color: var(--muted); font-weight: 500 }
.sec { display: grid; gap: 12px }
.sec h2 { font: 700 15px var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.words { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 6px 26px }
.w { display: grid; gap: 8px; padding: 20px 0 }
.w + .w { border-top: 1px solid var(--line) }
.w .ask { font: 400 18px/1.35 var(--b); color: var(--muted) }
.w .ask b { font: 700 14px var(--m); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-right: 12px }
.w .ans { font: 500 21px/1.38 var(--b); display: grid; grid-template-columns: 30px 1fr; align-items: baseline }
.w .ans i { font-style: normal; color: var(--pass); font-weight: 700 }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px }
.n { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px }
.n .k { font: 700 14px var(--m); letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
.n .ask { font: 400 16px/1.35 var(--b); color: var(--muted) }
.n .ans { font: 800 30px/1.1 var(--d); letter-spacing: -0.01em; display: flex; gap: 10px; align-items: baseline }
.n .ans i { font: 700 22px var(--m); font-style: normal; color: var(--pass) }
.n.cmp { background: transparent; border-style: dashed }
.cmp .row { display: flex; justify-content: space-between; font: 500 17px var(--b); padding: 3px 0 }
.cmp .row b { font: 800 22px var(--d) }
.foot { margin-top: auto; display: flex; justify-content: space-between; font: 500 18px var(--m); color: var(--muted); border-top: 2px solid var(--line); padding-top: 20px }
</style></head>
<body><div class="card" id="card"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent), C = D.card2, s = D.runs[D.star];
const ids = D.everyday.map(e => e.id);
const ev = k => D.runs[k].rows.filter(r => ids.includes(r.id) && r.pass).length;
const ok = id => s.rows.find(r => r.id === id).pass;
const text = D.everyday.filter(e => e.group === "text"), num = D.everyday.filter(e => e.group === "num");
document.getElementById("card").innerHTML = `
 <div class="top"><div><div class="eyebrow">${C.eyebrow}</div><h1>${C.headline}</h1></div>
   <div class="score"><b>${ev(D.star)}</b><span>/9</span></div></div>
 <div class="sec"><h2>${C.textTitle}</h2><div class="words">${text.map(e => `<div class="w">
   <div class="ask"><b>${e.label}</b>${e.cardAsk || e.ask}</div>
   <div class="ans"><i>${ok(e.id) ? "✓" : "✗"}</i><span>“${e.cardAnswer || e.answer}”</span></div></div>`).join("")}</div></div>
 <div class="sec"><h2>${C.numTitle}</h2><div class="nums">${num.map(e => `<div class="n">
   <div class="k">${e.label}</div><div class="ask">${e.cardAsk || e.ask}</div>
   <div class="ans"><i>${ok(e.id) ? "✓" : "✗"}</i>${e.cardAnswer || e.answer}</div></div>`).join("")}
   <div class="n cmp"><div class="k">${C.cmpTitle}</div>${D.order.filter(k => k !== D.star).map(k =>
     `<div class="row"><span>${D.runs[k].name.replace(" · ", ", ")}</span><b>${ev(k)}/9</b></div>`).join("")}</div></div></div>
 <div class="foot"><span>${C.footL}</span><span>${C.footR}</span></div>`;
</script></body></html>
